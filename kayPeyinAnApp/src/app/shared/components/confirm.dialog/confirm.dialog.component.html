<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button class="btn-success" (click)="cancel()">
    {{ data.cancelLabel ?? 'Annuler' }}
  </button>
  <button mat-raised-button class="btn-danger" (click)="confirm()">
    {{ data.confirmLabel ?? 'Confirmer' }}
  </button>
</mat-dialog-actions>
